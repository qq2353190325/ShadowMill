name: Build macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目当前无原生模块，此步作为保险：若有原生模块则自动 rebuild
      - name: Rebuild native dependencies (if any)
        run: npx electron-builder install-app-deps

      # 与本地 dist 流程一致：先拷贝运行时资源，再编译 renderer/main
      - name: Build app (electron-vite)
        run: |
          npm run runtime:pack
          npm run build

      # 产出 dmg + zip；未配置签名 secrets 时 electron-builder 自动退化为 ad-hoc 签名
      - name: Package macOS app
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowmill-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      # push tag（v*）时创建 GitHub Release 并附带构建产物
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
