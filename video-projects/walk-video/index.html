<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;600&family=Space+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* === Walk Cycle identity === */
        --bg: #121c2b;
        --ink: #f7efdf;
        --accent: #ff8a5c;
        --accent-dim: #b84a2c;
        --muted: #9fb0c4;
        --pant: #2e4057;
        --pant-side: #243650;
        --skin: #ffd7b0;
        --skin-side: #f3c79c;
        --hair: #3b2a20;
        --ground: #1a2738;
        --sun: #ffc36e;
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-body: "Work Sans", sans-serif;
        --font-data: "Space Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-content {
        width: 100%;
        height: 100%;
        padding: 0;
        display: block;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
      }
      .clip {
      }

      .display {
        font-family: var(--font-display);
        font-weight: 800;
        line-height: 1.05;
        color: var(--ink);
      }
      .body-text {
        font-family: var(--font-body);
        font-weight: 400;
        line-height: 1.5;
        color: var(--muted);
      }
      .kicker {
        font-family: var(--font-data);
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--accent);
      }

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.14;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1.2px),
          radial-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1.2px);
        background-size:
          3px 3px,
          5px 5px;
        background-position:
          0 0,
          1px 2px;
        mix-blend-mode: overlay;
      }

      /* full-bleed vector art */
      #art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /*
       * Limbs are rotated by GSAP with svgOrigin "0 0".
       * Each limb's local origin (0,0) IS its hip/shoulder pivot, and its shape
       * extends downward from there — so the pivot always matches the SVG anchor.
       */

      /* title block — top-left, above the art */
      #titleblock {
        position: absolute;
        top: 110px;
        left: 140px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #title {
        font-size: 64px;
        max-width: 860px;
      }
      #title .char {
        display: inline-block;
      }
      #sub {
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="5"
    >
      <!-- SCENE 1 -- visible from t=0, 0-5s -->
      <div class="scene clip" id="s1" data-start="0" data-duration="5" data-track-index="0">
        <div class="grain"></div>
        <div class="scene-content">
          <svg id="art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#24344c" />
                <stop offset="100%" stop-color="#101a29" />
              </linearGradient>
            </defs>

            <!-- sky -->
            <rect width="1920" height="1080" fill="url(#sky)" />

            <!-- sun + halo (glow pulse) -->
            <circle id="halo" cx="1480" cy="230" r="150" fill="var(--sun)" opacity="0.25" />
            <circle id="sun" cx="1480" cy="230" r="74" fill="var(--sun)" opacity="0.85" />

            <!-- clouds (row, period 960 => loops safely at -960px) -->
            <g id="clouds" fill="#e8edf2">
              <g transform="translate(160,150)">
                <circle cx="0" cy="0" r="26" />
                <circle cx="-34" cy="8" r="20" />
                <circle cx="34" cy="10" r="18" />
                <rect x="-46" y="0" width="92" height="30" rx="15" />
              </g>
              <g transform="translate(1120,220)">
                <circle cx="0" cy="0" r="30" />
                <circle cx="-38" cy="9" r="23" />
                <circle cx="38" cy="11" r="20" />
                <rect x="-50" y="0" width="100" height="34" rx="17" />
              </g>
              <g transform="translate(2080,130)">
                <circle cx="0" cy="0" r="24" />
                <circle cx="-32" cy="7" r="19" />
                <circle cx="32" cy="9" r="17" />
                <rect x="-43" y="0" width="86" height="28" rx="14" />
              </g>
              <g transform="translate(3040,200)">
                <circle cx="0" cy="0" r="28" />
                <circle cx="-36" cy="8" r="21" />
                <circle cx="36" cy="10" r="19" />
                <rect x="-48" y="0" width="96" height="32" rx="16" />
              </g>
            </g>

            <!-- ground band + horizon -->
            <rect y="560" width="1920" height="520" fill="var(--ground)" />
            <line x1="0" y1="560" x2="1920" y2="560" stroke="rgba(247,239,223,0.18)" stroke-width="2" />

            <!-- road dashes (period 320 => loops safely at -960px) -->
            <line
              id="rm"
              x1="0"
              y1="640"
              x2="1920"
              y2="640"
              stroke="rgba(247,239,223,0.30)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="120 200"
            />

            <!-- trees (row, spacing 320 => loops safely at -960px) -->
            <g id="trees">
              <g transform="translate(160,560)">
                <rect x="-9" y="-70" width="18" height="60" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-96" r="42" fill="#2e6b4f" />
              </g>
              <g transform="translate(480,560)">
                <rect x="-8" y="-64" width="16" height="54" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-88" r="38" fill="#35765a" />
              </g>
              <g transform="translate(800,560)">
                <rect x="-10" y="-74" width="20" height="64" rx="7" fill="#3c2f26" />
                <circle cx="0" cy="-100" r="45" fill="#2a6350" />
              </g>
              <g transform="translate(1120,560)">
                <rect x="-8" y="-66" width="16" height="56" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-90" r="39" fill="#35765a" />
              </g>
              <g transform="translate(1440,560)">
                <rect x="-9" y="-72" width="18" height="62" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-98" r="43" fill="#2e6b4f" />
              </g>
              <g transform="translate(1760,560)">
                <rect x="-8" y="-62" width="16" height="52" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-86" r="37" fill="#35765a" />
              </g>
              <g transform="translate(2080,560)">
                <rect x="-9" y="-70" width="18" height="60" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-96" r="42" fill="#2a6350" />
              </g>
              <g transform="translate(2400,560)">
                <rect x="-8" y="-64" width="16" height="54" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-88" r="38" fill="#35765a" />
              </g>
              <g transform="translate(2720,560)">
                <rect x="-10" y="-74" width="20" height="64" rx="7" fill="#3c2f26" />
                <circle cx="0" cy="-100" r="45" fill="#2e6b4f" />
              </g>
              <g transform="translate(3040,560)">
                <rect x="-8" y="-66" width="16" height="56" rx="6" fill="#3c2f26" />
                <circle cx="0" cy="-90" r="39" fill="#2a6350" />
              </g>
            </g>

            <!-- ========================================================= -->
            <!-- CHARACTER — side profile, facing RIGHT (+x), walking left → right -->
            <!-- Local char coords: origin = hip centre (y=0); +y down; feet y≈120 -->
            <!-- ========================================================= -->
            <g id="charwrap">
              <!-- ground shadow travels with the walker -->
              <ellipse id="shadow" cx="8" cy="124" rx="92" ry="12" fill="rgba(8,12,18,0.35)" />

              <g id="char">
                <!-- back arm (far side, darker; pivot at shoulder (10,-122)) -->
                <g transform="translate(10,-122)">
                  <g id="arm-b">
                    <rect x="-6" y="0" width="13" height="80" rx="6.5" fill="var(--accent-dim)" />
                    <ellipse cx="-3" cy="90" rx="12" ry="10" fill="var(--skin-side)" />
                  </g>
                </g>

                <!-- back leg (far side, darker; pivot at hip (-8,0)) -->
                <g transform="translate(-8,0)">
                  <g id="leg-b">
                    <rect x="-8" y="0" width="16" height="100" rx="8" fill="var(--pant-side)" />
                    <rect x="1" y="96" width="22" height="12" rx="5" fill="var(--accent-dim)" />
                    <ellipse cx="10" cy="108" rx="23" ry="12" fill="var(--accent-dim)" />
                  </g>
                </g>

                <!-- torso + head (static side profile) -->
                <g id="body">
                  <!-- torso, slightly leaning forward -->
                  <rect
                    x="-16"
                    y="-122"
                    width="46"
                    height="118"
                    rx="24"
                    transform="rotate(7 10 -60)"
                    fill="var(--accent)"
                  />
                  <!-- belt -->
                  <rect x="-14" y="-6" width="44" height="13" rx="6.5" fill="var(--accent-dim)" />
                  <!-- neck -->
                  <rect x="-3" y="-136" width="13" height="17" rx="6" fill="var(--skin)" />

                  <!-- head: skin base + hair mass on the back (left, behind) -->
                  <ellipse cx="-4" cy="-176" rx="30" ry="38" fill="var(--hair)" />
                  <ellipse cx="14" cy="-172" rx="30" ry="38" fill="var(--skin)" />

                  <!-- back hair tuft / swept-back tail -->
                  <path
                    d="M -28 -196 q -20 -8 -26 4 q 16 -4 20 2 q -10 18 2 24 q 8 -14 12 -22 z"
                    fill="var(--hair)"
                  />
                  <!-- hair top + cap -->
                  <path
                    d="M -10 -196 q 4 -30 36 -30 q 30 0 38 24 l -6 4 q -8 -14 -28 -13 q -22 1 -32 11 q 2 -8 6 -16 z"
                    fill="var(--hair)"
                  />
                  <path
                    d="M 2 -208 q 6 -24 38 -22 q 26 2 32 22 q -12 -12 -34 -12 q -24 0 -36 12 z"
                    fill="var(--accent-dim)"
                  />
                  <!-- cap brim pointing right -->
                  <path
                    d="M 36 -214 h 24 q 9 5 5 13 h -28 q -7 -2 -1 -13 z"
                    fill="var(--accent-dim)"
                  />

                  <!-- ear -->
                  <ellipse cx="2" cy="-166" rx="6" ry="9" fill="#f7cba0" />
                  <!-- eye (side view, facing right) -->
                  <circle cx="34" cy="-172" r="5" fill="#20150e" />
                  <circle cx="35.5" cy="-173.5" r="1.6" fill="#fff" />
                  <!-- eyebrow -->
                  <path
                    d="M 25 -182 q 9 -6 17 -2"
                    stroke="#20150e"
                    stroke-width="3.5"
                    stroke-linecap="round"
                    fill="none"
                  />
                  <!-- nose -->
                  <ellipse cx="44" cy="-164" rx="6" ry="5.5" fill="#f0b383" />
                  <!-- cheek -->
                  <circle cx="26" cy="-156" r="7" fill="#ff9c7b" opacity="0.55" />
                  <!-- mouth -->
                  <path
                    d="M 41 -153 q 6 3 12 1"
                    stroke="#20150e"
                    stroke-width="3"
                    stroke-linecap="round"
                    fill="none"
                  />
                </g>

                <!-- front leg (near side; pivot at hip (8,0)) -->
                <g transform="translate(8,0)">
                  <g id="leg-f">
                    <rect x="-8" y="0" width="16" height="100" rx="8" fill="var(--pant)" />
                    <rect x="3" y="96" width="23" height="12" rx="5" fill="var(--accent)" />
                    <ellipse cx="12" cy="108" rx="24" ry="12" fill="var(--accent)" />
                  </g>
                </g>

                <!-- front arm (near side; pivot at shoulder (16,-118)) -->
                <g transform="translate(16,-118)">
                  <g id="arm-f">
                    <rect x="-7" y="0" width="14" height="84" rx="7" fill="var(--accent)" />
                    <ellipse cx="-3" cy="95" rx="13" ry="11" fill="var(--skin)" />
                  </g>
                </g>
              </g>
            </g>
          </svg>

          <!-- title block -->
          <div id="titleblock">
            <div id="kicker" class="kicker">A 5-SECOND WALK</div>
            <h1 id="title" class="display">
              <span class="char">E</span><span class="char">v</span><span class="char">e</span><span class="char">r</span><span class="char">y</span><span class="char">&nbsp;</span><span class="char">S</span><span class="char">t</span><span class="char">e</span><span class="char">p</span><span class="char">&nbsp;</span><span class="char">C</span><span class="char">o</span><span class="char">u</span><span class="char">n</span><span class="char">t</span><span class="char">s</span>
            </h1>
            <p id="sub" class="body-text">keep moving forward</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // === SCENE 1 (0-5s) — side-profile walking loop, left → right ===

      // --- Place the walker on screen (entrance tweens for world/title) ---
      tl.set("#charwrap", { x: 180, y: 438 }, 0);

      tl.from("#clouds", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.from("#trees", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0.35);
      tl.from("#kicker", { y: 18, autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 0.35);
      tl.from(
        "#title .char",
        { y: 44, autoAlpha: 0, duration: 0.5, ease: "back.out(1.6)", stagger: { each: 0.055, from: "start" } },
        0.45
      );
      tl.from("#rm", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.from("#sub", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 0.7);

      // --- Walking cycle (deterministic, finite repeats sized to the 5s window) ---
      // Gait: one stride = 0.9 s. 4 strides: 0.60 → 4.20 ; 0.90*4 = 3.60
      // Left→right locomotion, whole character group:
      // leg-f (near right leg) & arm-b (far arm) share phase; opposite phase on the
      // symmetric pair → natural contra-lateral gait (arm swings opposite to same-side leg).

      // (1) Horizontal locomotion: whole walker slides 180 → 1780 (ease none, linear)
      tl.to("#charwrap", { x: 1780, duration: 4.0, ease: "none" }, 0.6);

      // (2) Body bob — one rise+fall per step (0.45 s half-cycle @ yoyo)
      //     0.60 + 0.45*2*(3+1) = 4.20
      tl.to("#char", { y: -7, duration: 0.45, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.6);

      // (3) Legs — alternating stride swings around hip pivots (local origin 0,0):
      //     near leg steps forward (+rot), far leg forward at half-stride offset.
      //     leg-f: -14°(back) → +20°(forward), 4 strides: 0.60→4.20
      tl.fromTo(
        "#leg-f",
        { rotation: -14 },
        { rotation: 20, svgOrigin: "0 0", duration: 0.9, ease: "sine.inOut", repeat: 3 },
        0.6
      );
      //     leg-b: offset half a stride (start 1.05), finishes 4.65
      tl.fromTo(
        "#leg-b",
        { rotation: 20 },
        { rotation: -14, svgOrigin: "0 0", duration: 0.9, ease: "sine.inOut", repeat: 3 },
        1.05
      );

      // (4) Arms — contra-lateral to legs, swinging around shoulder pivots:
      //     far arm swings with the near leg (same phase):
      tl.fromTo(
        "#arm-b",
        { rotation: -10 },
        { rotation: 12, svgOrigin: "0 0", duration: 0.9, ease: "sine.inOut", repeat: 3 },
        0.6
      );
      //     near arm swings opposite to the near leg:
      tl.fromTo(
        "#arm-f",
        { rotation: 10 },
        { rotation: -12, svgOrigin: "0 0", duration: 0.9, ease: "sine.inOut", repeat: 3 },
        1.05
      );

      // --- Background parallax: world scrolls left (opposite to travel), linear ---
      // All offsets are integer multiples of each element's repetition period → seamless.
      tl.to("#rm", { x: -960, duration: 4.0, ease: "none" }, 0.6);
      tl.to("#trees", { x: -960, duration: 4.0, ease: "none" }, 0.6);
      tl.to("#clouds", { x: -960, duration: 4.0, ease: "none" }, 0.6);

      // --- Sustained accents ---
      // title float: 0.70 + 0.5*2*4 = 4.70
      tl.to("#title", { y: -6, duration: 0.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.7);
      // halo glow: 0.60 + 0.66*2*3 = 4.56
      tl.to("#halo", { opacity: 0.45, duration: 0.66, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.6);
      // kicker pulse: 0.70 + 0.7*2*3 = 4.90
      tl.to("#kicker", { opacity: 0.55, duration: 0.7, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.7);

      // Single scene, no shader transitions — timeline stays within the 5s window.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
