<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; frame-src file:; media-src 'self' file:; script-src 'self' 'unsafe-inline'" />
  <title>我的应用</title>
  <link rel="stylesheet" href="renderer.css" />
</head>
<body>
  <!-- 自绘标题栏（深空科技风格，可拖拽窗口） -->
  <header class="titlebar">
    <div class="titlebar-left">
      <svg class="titlebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/>
      </svg>
      <span class="titlebar-title">我的应用</span>
    </div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M4 8.5h8"/>
        </svg>
      </button>
      <button class="win-btn" id="btn-max" title="最大化">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect id="icon-max" x="3.5" y="3.5" width="9" height="9" rx="1"/>
          <g id="icon-restore" style="display: none">
            <rect x="4" y="6" width="7.5" height="7.5" rx="1"/>
            <rect x="6.5" y="3.5" width="7.5" height="7.5" rx="1" fill="#0B1220"/>
          </g>
        </svg>
      </button>
      <button class="win-btn win-close" id="btn-close" title="关闭">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧菜单（文字菜单） -->
    <aside class="sidebar">
      <!-- <div class="logo">我的应用</div> -->
      <nav class="menu" id="menu">
        <div class="menu-item active" data-page="home" title="首页">首页</div>
        <div class="menu-item" data-page="content" title="内容脚本">内容脚本</div>
        <div class="menu-item" data-page="text-tts" title="配音（文字生音频）">配音</div>
        <div class="menu-item" data-page="subtitle" title="字幕生成">字幕生成</div>
        <div class="menu-item" data-page="html-gen" title="HTML生成">HTML生成</div>
        <div class="menu-item" data-page="video-gen" title="视频生成">视频生成</div>
        <div class="menu-item" data-page="about" title="关于">关于</div>
        <div class="menu-item" data-page="settings" title="设置">设置</div>
      </nav>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content" id="content">
      <h1>欢迎</h1>
      <p>点击左侧菜单切换内容。</p>
    </main>
  </div>

  <script src="renderer/app.js"></script>
  <!-- 每个页面一个文件夹：template.js（DOM 模板 → App.templates）+ index.js（逻辑） -->
  <script src="renderer/pages/home/template.js"></script>
  <script src="renderer/pages/content/template.js"></script>
  <script src="renderer/pages/textTts/template.js"></script>
  <script src="renderer/pages/subtitle/template.js"></script>
  <script src="renderer/pages/soundCopy/template.js"></script>
  <script src="renderer/pages/htmlGen/template.js"></script>
  <script src="renderer/pages/video/template.js"></script>
  <script src="renderer/pages/settings/template.js"></script>
  <script src="renderer/pages/home/index.js"></script>
  <script src="renderer/pages/content/index.js"></script>
  <script src="renderer/pages/textTts/index.js"></script>
  <script src="renderer/pages/textTts/synth.js"></script>
  <script src="renderer/pages/textTts/align.js"></script>
  <script src="renderer/pages/subtitle/index.js"></script>
  <script src="renderer/pages/subtitle/transcribe.js"></script>
  <script src="renderer/pages/soundCopy/index.js"></script>
  <script src="renderer/pages/htmlGen/index.js"></script>
  <script src="renderer/pages/video/index.js"></script>
  <script src="renderer/pages/settings/index.js"></script>
  <script src="renderer/pages/settings/whisper.js"></script>
  <script src="renderer/entry.js"></script>
</body>
</html>
